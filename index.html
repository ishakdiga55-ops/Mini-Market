<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوق صغير | Mini Souk — منصة التجار المستقلين</title>
  <meta name="description" content="سوق صغير (Mini Souk) — منصة تجارة إلكترونية متعددة البائعين تربطك مباشرة بأفضل التجار والحرفيين الجزائريين عبر واتساب." />
  <!-- ترتيب استيراد ملفات التنسيق الإجباري -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 🧭 شريط التنقل العلوي الزجاجي (Navbar) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="container navbar-inner">
      <!-- شعار وهوية سوق صغير -->
      <a href="#/" class="brand-logo" onclick="window.resetAllFilters()">
        <span class="brand-icon-box">🏺</span>
        <div class="brand-text-wrap">
          <span data-i18n="nav.homeTitle">سوق صغير</span>
          <span class="brand-sub-tag">Mini Souk DZ</span>
        </div>
      </a>

      <!-- شريط البحث الفوري الشامل -->
      <div class="nav-search-box">
        <span class="nav-search-icon">🔍</span>
        <input
          type="search"
          id="globalSearchInput"
          data-i18n-placeholder="nav.searchPlaceholder"
          placeholder="ابحث عن منتج، متجر، أو مدينة (مثل: كراكو، بقلاوة، قسنطينة)..."
          oninput="window.handleGlobalSearch(this.value)"
        />
      </div>

      <!-- روابط الصفحات السريعة -->
      <nav class="nav-links-group" aria-label="Main Navigation">
        <a href="#/" class="nav-link-item active" data-i18n="nav.home">الرئيسية</a>
        <a href="#/dashboard" class="nav-link-item" data-i18n="nav.dashboard">لوحة التاجر</a>
      </nav>

      <!-- أزرار التحكم: المفضلة، السلة، اللغة 🌐، والوضع الليلي 🌙/☀️ -->
      <div class="nav-actions-group">
        <!-- زر المفضلة -->
        <button
          type="button"
          id="navWishlistBtn"
          class="icon-pill-btn"
          onclick="window.toggleWishlistFilter()"
          data-i18n-title="nav.wishlist"
          title="المفضلة"
        >
          <span>❤️</span>
          <span id="navWishlistCount" class="counter-badge">2</span>
        </button>

        <!-- زر السلة -->
        <a href="#/cart" class="icon-pill-btn" data-i18n-title="nav.cart" title="السلة">
          <span>🛒</span>
          <span data-i18n="nav.cart">السلة</span>
          <span id="navCartCount" class="counter-badge">0</span>
        </a>

        <!-- مبدل اللغات الثلاثي 🌐 (AR / FR / EN) -->
        <div class="lang-switcher-wrap" role="group" aria-label="Language Switcher">
          <div class="lang-dropdown">
            <button type="button" class="lang-btn active" data-lang-option="ar" onclick="window.setLanguage('ar')">عربي</button>
            <button type="button" class="lang-btn" data-lang-option="fr" onclick="window.setLanguage('fr')">FR</button>
            <button type="button" class="lang-btn" data-lang-option="en" onclick="window.setLanguage('en')">EN</button>
          </div>
        </div>

        <!-- زر تبديل الوضع الداكن/الفاتح 🌙/☀️ -->
        <button
          type="button"
          class="icon-pill-btn"
          onclick="window.toggleTheme()"
          data-i18n-title="nav.themeToggle"
          title="تبديل المظهر"
        >
          <span id="themeToggleIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- ⚡ حاوية تطبيق الصفحة الواحدة (SPA Router Outlet) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <main id="appRoot" aria-live="polite"></main>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 🔔 حاوية إشعارات الـ Toasts -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 🏛️ تذييل المنصة (Footer) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="brand-logo">
        <span class="brand-icon-box">🏺</span>
        <div class="brand-text-wrap">
          <span>سوق صغير — Mini Souk</span>
          <span class="brand-sub-tag">منصة التجار والحرفيين المستقلين في الجزائر 🇩🇿</span>
        </div>
      </div>

      <div class="footer-links">
        <a href="#/" data-i18n="nav.home">الرئيسية</a>
        <a href="#/cart" data-i18n="nav.cart">السلة</a>
        <a href="#/dashboard" data-i18n="nav.dashboard">لوحة التاجر</a>
      </div>

      <small>© 2026 Mini Souk — يعمل مباشرة عبر المتصفح وواتساب بدون وسطاء.</small>
    </div>
  </footer>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 📜 ترتيب استيراد ملفات الجافاسكريبت الإجباري -->
  <!-- style.css → components.css → data.js → i18n.js → app.js → dashboard.js -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
